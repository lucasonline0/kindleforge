name: Build
on:
  push:
  pull_request:
  release:
    types: [created]
permissions: { contents: write }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: mkdir -p release && cp dist/*.AppImage dist/*.pacman dist/*.deb dist/*.rpm release/ && sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with: { files: release/* }
